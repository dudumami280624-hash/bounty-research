name: Research Router Tests
on:
  push:
    paths:
      - research_router.py
      - test_research_router.py
      - .github/workflows/research-router-tests.yml
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run path router regression tests
        run: python -m unittest -v test_research_router
