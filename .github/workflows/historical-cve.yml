name: Historical CVE knowledge backfill
on:
  workflow_dispatch:
  push:
    paths:
      - collect_historical_cves.py
      - .github/workflows/historical-cve.yml
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch first historical window and preserve evidence
        run: |
          set -euo pipefail
          python collect_historical_cves.py --max-windows 1 2>&1 | tee historical-cve.log
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("historical-cve/manifest.json").read_text())
          assert state and all(v["count"] >= 0 for v in state.values())
          print("Validated historical windows:",len(state))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-cve-first-window
          path: |
            historical-cve/
            historical-cve.log
          retention-days: 90
          if-no-files-found: warn
