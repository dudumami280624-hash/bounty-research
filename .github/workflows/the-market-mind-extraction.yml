name: The Market Mind - hourly source extraction
# Verification run: prioritize an indexed PDF after the successful PPTX run.

on:
  schedule:
    - cron: '54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/the-market-mind-extraction.yml'

permissions:
  contents: write

concurrency:
  group: tmm-hourly-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory/the-market-mind-daily
          persist-credentials: true
          sparse-checkout: |
            knowledge/trading-education/tools
            knowledge/trading-education/integration
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF text and image parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Verify parser on synthetic DOCX PPTX PDF fixtures
        run: python knowledge/trading-education/tools/smoke_test.py
      - name: Extract next indexed source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python knowledge/trading-education/tools/run_extraction_batch.py
      - name: Commit metadata-only progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/trading-education/integration/extraction-state.json knowledge/trading-education/integration/latest-extraction-report.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: record source extraction progress"
            git push origin HEAD:memory/the-market-mind-daily
          fi
