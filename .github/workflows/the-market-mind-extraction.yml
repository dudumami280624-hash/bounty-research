name: The Market Mind - hourly source extraction
# 2026-11-23: run sparse PDF OCR gate regression with raster_images fixture input (research d6fbbec).
# 2026-11-23: check per-window unresolved OCR failure accounting (research f6a1f9c).
# 2026-11-23: run real extraction before regression suite; preserve bounded OCR time.
# 2026-11-23: distinguish empty initial extraction queue from outstanding OCR page queues (research 89ca416).
# 2026-11-23: regression prevents legacy embedded-text flags from masking failed OCR (898db631).
# Preserve successful OCR page evidence on transient retry failures (research f8a9ed2).
# Distinguish actual OCR from embedded PDF text in visual evidence (research c532e69).
# Report text extraction state separately from independently verified full coverage (72a0609).
# Verify English draft generation without independent-verification blocking.
# Reject empty Tesseract output as successful OCR (research 520450b).
# Regression: execute sparse-page character count and correct regex (research 3174a44, 43174aa).
# Repair checkpoint fixture using separate in-bounds text draws (research 3971b0b); previous CI 44982683219 failed.
# Retry exhausted source failures after six-hour cooldown (research e482a362).
# PDF parser page-window API introduced in research 245e58a; validate through CI.
# Regression: partial OCR is resumed by page audit, not re-extracted each batch.
# Page-specific OCR retries retain failed page numbers and six-hour cooldown.
# Prioritize first 26 and started PDF page audits without starvation (research 3fa95d3).
# Hard per-source process-group timeout prevents native PDF/OCR hangs (3bceb66).
# 2026-11-23: rerun parser and captioned-raster OCR regression after removing two
# literal backslash-n syntax errors in research free_visual.py (4b2a2a08).

on:
  schedule:
    - cron: '54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/the-market-mind-extraction.yml'

permissions:
  contents: write

# A newer run supersedes a stuck older extraction run.
# A 45-minute cap accommodates bounded extraction (15m), visual OCR (5m),
# dependency installation and regression tests; a 24m cap could preempt OCR.
concurrency:
  group: tmm-hourly-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory/the-market-mind-daily
          persist-credentials: true
          fetch-depth: 0
          sparse-checkout: |
            knowledge/trading-education/tools
            knowledge/trading-education/integration
          sparse-checkout-cone-mode: true
      # Persist the genuine run ID BEFORE dependency installs, OCR and long tests.
      # This separate early push survives later job timeout/failure when checkout succeeded.
      - name: Publish early real Actions run locator
        env:
          TMM_RUN_ID: ${{ github.run_id }}
          TMM_RUN_ATTEMPT: ${{ github.run_attempt }}
          TMM_WORKFLOW_SHA: ${{ github.sha }}
          TMM_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          path = Path('knowledge/trading-education/integration/actions-run-locator.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          run_id = os.environ['TMM_RUN_ID']
          repo = os.environ['TMM_REPOSITORY']
          data = {
              'run_id': run_id,
              'run_attempt': int(os.environ['TMM_RUN_ATTEMPT']),
              'workflow_commit_sha': os.environ['TMM_WORKFLOW_SHA'],
              'run_url': f'https://github.com/{repo}/actions/runs/{run_id}',
              'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'verification_status': 'early_locator_only_not_job_result',
              'note': 'Recorded before extraction; not evidence of successful OCR or passing CI.'
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('EARLY REAL ACTIONS RUN LOCATOR', data['run_url'], flush=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/trading-education/integration/actions-run-locator.json
          git commit -m "chore: persist real Actions run locator before processing"
          for attempt in 1 2 3; do
            git fetch origin memory/the-market-mind-daily
            if git rebase origin/memory/the-market-mind-daily && git push origin HEAD:memory/the-market-mind-daily; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'EARLY_RUN_LOCATOR_PUSH_FAILED' >&2
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR for image-only PDF pages
        timeout-minutes: 4
        run: |
          # Preinstalled Tesseract on hosted runners may have English only.
          # Check the language pack independently instead of skipping Chinese OCR.
          if ! command -v tesseract >/dev/null 2>&1 || ! tesseract --list-langs 2>/dev/null | grep -qx 'chi_sim'; then
            echo 'Installing Tesseract and simplified-Chinese language data'
            timeout 210s sudo apt-get update -qq &&
              timeout 60s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim ||
              echo 'WARNING: Chinese OCR unavailable; scanned Chinese pages remain unverified'
          fi
          if command -v tesseract >/dev/null 2>&1; then
            tesseract --list-langs
            if ! tesseract --list-langs 2>/dev/null | grep -qx 'chi_sim'; then
              echo 'WARNING: chi_sim missing; do not claim Chinese OCR coverage'
            fi
          else
            echo 'WARNING: Tesseract unavailable; OCR pages remain unverified'
          fi
      - name: Install free legacy Office converter for six deferred documents
        timeout-minutes: 4
        run: |
          if command -v libreoffice >/dev/null 2>&1; then
            libreoffice --version
          else
            echo 'Installing libreoffice-writer and libreoffice-impress for .doc/.ppt'
            timeout 210s sudo apt-get update -qq &&
              timeout 90s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-impress ||
              echo 'WARNING: converter installation unavailable; legacy sources remain needs_conversion'
          fi
          command -v libreoffice && libreoffice --version || true
      - name: Install PDF text and image parser
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      # Research f938155: report real page-audit metadata separately from OCR completion.
      # Test failures must be visible, but should not starve real source processing.
      # Extraction is independently bounded and retains unverified status.
      - name: Compile production extraction and visual OCR modules before processing
        run: python -m py_compile knowledge/trading-education/tools/run_extraction_batch.py knowledge/trading-education/tools/resume_visual_pages.py knowledge/trading-education/tools/free_visual.py
      - name: Extract next indexed source
        if: always()
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMM_TEXT_AUDIT_BUDGET_SECONDS: '90'
          TMM_TEXT_WINDOW_PAGES: '12' # bounded to 1-30 in research 89155d0
          TMM_BATCH_SIZE: '8'
          TMM_TIME_BUDGET_SECONDS: '780'
          TMM_PER_SOURCE_TIMEOUT_SECONDS: '90'
          TMM_VISUAL_MAX_PAGES: '12'
          TMM_OCR_PAGE_TIMEOUT_SECONDS: '12'
          TMM_INITIAL_OCR_MAX_PAGES: '4'
        run: python knowledge/trading-education/tools/run_extraction_batch.py
      # Revisit partial-OCR/visual-review PDFs; three failures now cool down for six hours,
      # then retry automatically rather than permanently stranding source pages.
      - name: Resume PDF visual page coverage (not semantic verification)
        if: always()
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMM_VISUAL_MAX_PAGES: '12'
          TMM_OCR_PAGE_TIMEOUT_SECONDS: '12'
          TMM_VISUAL_AUDIT_BUDGET_SECONDS: '240'
          TMM_VISUAL_WINDOWS_PER_RUN: '10'
        run: python knowledge/trading-education/tools/resume_visual_pages.py
      - name: Verify production visual scanner performs real Tesseract OCR on scanned PDF
        run: python knowledge/trading-education/tools/test_real_tesseract_smoke.py
      - name: Run real Tesseract OCR on generated image-only PDF (not textbook verification)
        run: python knowledge/trading-education/tools/test_real_ocr_smoke.py
      - name: Verify parser on synthetic DOCX PPTX PDF fixtures
        run: python knowledge/trading-education/tools/smoke_test.py
      # Regression includes configured per-page OCR deadline and incomplete visual coverage.
      # Blank PDF pages bypass OCR; timeout fixture now contains actual vector marks (research 7961006).
      - name: Test source-linked private English worksheet and research pipeline
        run: python knowledge/trading-education/tools/test_research_pipeline.py
      - name: Verify visual re-audit and extraction script syntax
        run: python -m py_compile knowledge/trading-education/tools/free_visual.py knowledge/trading-education/tools/test_captioned_raster_ocr.py knowledge/trading-education/tools/resume_visual_pages.py knowledge/trading-education/tools/run_extraction_batch.py
      - name: Verify real PDF parser flags raster charts with long selectable captions (generated fixture)
        run: python knowledge/trading-education/tools/test_pdf_raster_caption_audit.py
      - name: Verify bounded initial PDF OCR preserves deferred page locators (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_pdf_ocr_budget.py
      - name: Verify first-pass OCR failures receive page-specific cooldowns (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_first_pass_ocr_cooldown.py
      # Includes malformed/missing timestamps: failed sources must not be stranded.
      - name: Verify exhausted source retry cooldown with legacy UTC timestamps (production function; no source download)
        run: python knowledge/trading-education/tools/test_source_retry_timestamp.py
      - name: Verify legacy PDF text audit cooldown timestamps (synthetic only)
        run: python knowledge/trading-education/tools/test_pdf_text_retry_timestamp.py
      # Includes legacy string page IDs and malformed retry locators; not real OCR verification.
      - name: Verify legacy OCR retry timestamps cannot stall visual audit (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_visual_retry_timestamp.py
      - name: Verify unfinished PDF windows and due OCR retries interleave (synthetic only)
        run: python knowledge/trading-education/tools/test_visual_interleave.py
      - name: Verify failed OCR page retries rotate without starvation (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_ocr_retry_rotation.py
      - name: Reject empty or malformed visual audit windows (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_visual_window_validation.py
      - name: Verify legacy raster OCR re-audit scheduling (structural guard only)
        run: python knowledge/trading-education/tools/test_legacy_raster_reaudit.py
      - name: Verify captioned raster PDF receives real OCR (generated fixture, not textbooks)
        run: python knowledge/trading-education/tools/test_captioned_raster_ocr.py
      - name: Verify actual blank PDF pages do not consume OCR retries (generated PyMuPDF fixture)
        run: python knowledge/trading-education/tools/test_blank_pdf_page.py
      - name: Verify sparse embedded-text pages still receive OCR (synthetic PDF fixture)
        run: python knowledge/trading-education/tools/test_sparse_embedded_ocr.py
      - name: Verify sparse PDF text audit flags OCR-needed pages (synthetic guard only)
        run: python knowledge/trading-education/tools/test_sparse_text_audit.py
      - name: Verify copyright-safe page text fingerprint evidence (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_page_text_fingerprint.py
      - name: Verify embedded PDF text is not mislabeled OCR (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_text_origin_evidence.py
      - name: Verify failed raster OCR locator resolution (production function, synthetic metadata)
        run: python knowledge/trading-education/tools/test_ocr_failed_locator_resolution.py
      - name: Verify successful OCR evidence survives transient retry failure (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_preserve_ocr_evidence.py
      - name: Verify durable PDF page evidence checkpoints (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_page_evidence_checkpoint.py
      - name: Verify fair rotation of real OCR scheduler (synthetic scheduler regression only)
        run: python knowledge/trading-education/tools/test_visual_fair_rotation.py
      - name: Verify completed first-pass PDF scanner revision (production checkpoint regression)
        run: python knowledge/trading-education/tools/test_scanner_revision_checkpoint.py
      - name: Verify due OCR retry pages cannot starve (synthetic scheduler only)
        run: python knowledge/trading-education/tools/test_due_ocr_retry_priority.py
      - name: Verify OCR window fits hard deadline (synthetic arithmetic only)
        run: python knowledge/trading-education/tools/test_visual_window_budget.py
      - name: Verify adaptive visual OCR window retries (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_adaptive_visual_windows.py
      - name: Verify bounded PDF page windows and page locators (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_pdf_page_windows.py
      # Also rejects source-byte drift before advancing a persisted page cursor (research f7e1b5d).
      # Regression also checks fair rotation across three priority PDF sources (research 891c9b7).
      - name: Verify PDF text checkpoint resumes across CI runs (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_pdf_text_checkpoint.py
      - name: Verify PDF audit failure cooldown (synthetic guard only)
        run: python knowledge/trading-education/tools/test_text_audit_cooldown.py
      - name: Verify PDF text audit hard deadline and atomic checkpoint guards (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_text_audit_worker.py
      - name: Verify hard worker timeout regression (synthetic fixture only)
        run: python knowledge/trading-education/tools/test_hard_timeout.py
      - name: Build cross-source research catalog
        run: python knowledge/trading-education/tools/research_pipeline.py catalog knowledge/trading-education/integration/evidence-index --out knowledge/trading-education/integration/research-catalog.json
      - name: Verify provenance audit guards (synthetic fixtures only)
        run: python knowledge/trading-education/tools/test_audit_provenance.py
      - name: Audit catalog source provenance (offline; not fact verification)
        run: python knowledge/trading-education/tools/audit_provenance.py knowledge/trading-education/integration/research-catalog.json
      - name: Refresh cross-source research catalog
        if: always()
        run: python knowledge/trading-education/tools/research_pipeline.py catalog knowledge/trading-education/integration/evidence-index --out knowledge/trading-education/integration/research-catalog.json
      - name: Generate English working outlines without verification deadlock
        if: always()
        run: python knowledge/trading-education/tools/research_pipeline.py draft-all knowledge/trading-education/integration/research-catalog.json --out knowledge/trading-education/integration/english-working-outlines
      - name: Test offline MediaCrawler import (no platform requests)
        run: python -m unittest discover -s knowledge/trading-education/tools -p 'test_import_mediacrawler_export.py' -v
      - name: Build Horizon-inspired offline evidence briefing (no paid API)
        if: always()
        run: python knowledge/trading-education/tools/offline_research_briefing.py knowledge/trading-education/integration/research-catalog.json --out knowledge/trading-education/integration/offline-research-briefing.md
      - name: Generate chart and knowledge review queue
        if: always()
        run: python knowledge/trading-education/tools/review_queue.py
      - name: Summarize real pipeline run and stage counts
        if: always()
        run: |
          {
            echo "## The Market Mind source pipeline"
            echo "- GitHub Actions run ID: ${GITHUB_RUN_ID}"
            echo "- Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Research branch: memory/the-market-mind-daily"
            echo "- Text extraction and visual/OCR audit are separate stages; neither is fact verification."
            echo ""
            if [ -f knowledge/trading-education/integration/latest-extraction-report.md ]; then
              cat knowledge/trading-education/integration/latest-extraction-report.md
            else
              echo "No extraction report generated in this run."
            fi
            echo ""
            if [ -f knowledge/trading-education/integration/visual-page-coverage-progress.md ]; then
              cat knowledge/trading-education/integration/visual-page-coverage-progress.md
            else
              echo "No visual coverage report generated in this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist real Actions run locator for next-cycle verification
        if: always()
        env:
          TMM_RUN_ID: ${{ github.run_id }}
          TMM_RUN_ATTEMPT: ${{ github.run_attempt }}
          TMM_WORKFLOW_SHA: ${{ github.sha }}
          TMM_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          dest=Path('knowledge/trading-education/integration/actions-run-locator.json')
          dest.parent.mkdir(parents=True, exist_ok=True)
          repo=os.environ['TMM_REPOSITORY']
          run_id=os.environ['TMM_RUN_ID']
          data={
              'run_id':run_id,
              'run_attempt':int(os.environ['TMM_RUN_ATTEMPT']),
              'workflow_commit_sha':os.environ['TMM_WORKFLOW_SHA'],
              'run_url':f'https://github.com/{repo}/actions/runs/{run_id}',
              'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'verification_status':'run_locator_only_not_job_result',
              'note':'This file proves the workflow reached this step; inspect job logs and final conclusion separately.'
          }
          dest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+chr(10),encoding='utf-8')
          print('REAL ACTIONS RUN LOCATOR',data['run_url'],flush=True)
          PY
      - name: Commit metadata-only progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A knowledge/trading-education/integration/
          if ! git diff --cached --quiet; then
            git commit -m "chore: record source extraction progress"
            for attempt in 1 2 3; do
              git fetch origin memory/the-market-mind-daily
              if git rebase origin/memory/the-market-mind-daily && git push origin HEAD:memory/the-market-mind-daily; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            echo 'Failed to push progress after 3 attempts' >&2
            exit 1
          fi
