name: Offline scope guard regression tests
on:
  push:
    paths:
      - research_scope_guard.py
      - test_research_scope_guard.py
      - .github/workflows/scope-guard-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed scope regression tests
        run: python -m unittest -v test_research_scope_guard
