name: Solidity EVM environment smoke test
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Number of independent EVM replay iterations (1-10000)"
        required: false
        default: "100"
  push:
    paths:
      - .github/workflows/evm-smoke.yml
      - historical_replay/**
      - vulnerability_registry.py
      - test_vulnerability_registry.py
      - lab_catalog.py
      - knowledge_ingest.py
      - knowledge_sources/**
      - test_knowledge_ingest.py
permissions:
  contents: read
jobs:
  evm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Test knowledge learning integrity
        run: python -m unittest -v test_knowledge_ingest
      - name: Build deduplicated vulnerability knowledge snapshot
        run: |
          set -euo pipefail
          python knowledge_ingest.py knowledge_sources/seed.json vulnerability-knowledge.json | tee knowledge-ingestion.log
          python knowledge_ingest.py knowledge_sources/seed.json vulnerability-knowledge.json | tee -a knowledge-ingestion.log
          python - <<'PY'
          import json
          data = json.load(open("vulnerability-knowledge.json"))
          assert len(data) == 2
          assert all(x["verification"] == "unverified" for x in data.values())
          PY
      - name: Validate deduplication registry
        run: python -m unittest -v test_vulnerability_registry
      - name: Validate repetition count
        env:
          REPLAY_REPETITIONS: ${{ inputs.repetitions || '100' }}
        run: |
          [[ "$REPLAY_REPETITIONS" =~ ^[0-9]+$ ]] || exit 2
          (( REPLAY_REPETITIONS >= 1 && REPLAY_REPETITIONS <= 10000 )) || exit 2
          echo "REPLAY_REPETITIONS=$REPLAY_REPETITIONS" >> "$GITHUB_ENV"
      - name: Verify compiler and EVM runner
        run: |
          set -euxo pipefail
          forge --version
          cast --version
          anvil --version
          forge build --help >/dev/null
      - name: Compile public historical contract
        run: |
          mkdir -p /tmp/historical-replay/src
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/crytic/not-so-smart-contracts/master/reentrancy/Reentrancy.sol -o /tmp/historical-replay/src/Reentrancy.sol
          cd /tmp/historical-replay
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          out = "out"
          solc_version = "0.4.26"
          TOML
          forge build
      - name: Run isolated vulnerable and fixed EVM regression
        run: |
          set -euxo pipefail
          mkdir -p /tmp/historical-replay/test
          cp historical_replay/Reentrancy.t.sol /tmp/historical-replay/test/Reentrancy.t.sol
          cd /tmp/historical-replay
          set -o pipefail
          forge test -vvv --match-contract HistoricalReentryTest 2>&1 | tee "$GITHUB_WORKSPACE/evm-replay.log"
      - name: Replay official Ethernaut challenge source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ethernaut-replay/{src,test,lib/openzeppelin-contracts-06/math}
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/OpenZeppelin/ethernaut/master/contracts/src/levels/Reentrance.sol -o /tmp/ethernaut-replay/src/Reentrance.sol
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/OpenZeppelin/openzeppelin-contracts/v3.4.2/contracts/math/SafeMath.sol -o /tmp/ethernaut-replay/lib/openzeppelin-contracts-06/math/SafeMath.sol
          cp historical_replay/EthernautReentrance.t.sol /tmp/ethernaut-replay/test/EthernautReentrance.t.sol
          cd /tmp/ethernaut-replay
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.6.12"
          remappings = ["openzeppelin-contracts-06/=lib/openzeppelin-contracts-06/"]
          TOML
          set -o pipefail
          forge test -vvv --match-contract EthernautReentranceTest 2>&1 | tee "$GITHUB_WORKSPACE/ethernaut-replay.log"
      - name: Repeated cross-source EVM verification
        run: |
          set -euo pipefail
          echo "iteration,fixture,result" > replay-results.csv
          for ((i=1; i<=REPLAY_REPETITIONS; i++)); do
            for fixture in historical ethernaut; do
              if [[ "$fixture" == historical ]]; then
                project=/tmp/historical-replay
                contract=HistoricalReentryTest
              else
                project=/tmp/ethernaut-replay
                contract=EthernautReentranceTest
              fi
              if (cd "$project" && forge test --match-contract "$contract" --summary) >> replay-batch.log 2>&1; then
                echo "$i,$fixture,pass" >> replay-results.csv
              else
                echo "$i,$fixture,fail" >> replay-results.csv
                echo "Failure in $fixture iteration $i" | tee -a replay-batch.log
                exit 1
              fi
            done
          done
          sha256sum /tmp/historical-replay/src/Reentrancy.sol /tmp/ethernaut-replay/src/Reentrance.sol > fixture-sha256.txt
          echo "Completed $REPLAY_REPETITIONS iterations for each independent source"
      - name: Integrate Damn Vulnerable DeFi challenge environment
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.1.0 https://github.com/theredguild/damn-vulnerable-defi.git /tmp/dvd-challenges
          cd /tmp/dvd-challenges
          forge build 2>&1 | tee "$GITHUB_WORKSPACE/dvd-build.log"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/dvd-source-revision.txt"
      - name: Collect cross-lab public source provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from lab_catalog import LABS
          with open("lab-catalog.json","w") as f:
              json.dump(LABS,f,indent=2)
          PY
          for entry in "smartbugs-curated https://github.com/smartbugs/smartbugs-curated.git" "slither-detectors https://github.com/crytic/slither.git"; do
            read -r label url <<< "$entry"
            git ls-remote "$url" HEAD | awk -v label="$label" '{print label "," $1}' >> external-lab-revisions.csv
          done
      - name: Save environment versions
        run: |
          { forge --version; cast --version; anvil --version; } > evm-versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evm-replay-evidence
          path: |
            evm-versions.txt
            evm-replay.log
            ethernaut-replay.log
            replay-batch.log
            replay-results.csv
            fixture-sha256.txt
            dvd-build.log
            dvd-source-revision.txt
            lab-catalog.json
            external-lab-revisions.csv
            vulnerability-knowledge.json
            knowledge-ingestion.log
          if-no-files-found: warn
