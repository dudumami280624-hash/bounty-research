name: Solidity EVM environment smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/evm-smoke.yml
      - historical_replay/**
permissions:
  contents: read
jobs:
  evm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify compiler and EVM runner
        run: |
          set -euxo pipefail
          forge --version
          cast --version
          anvil --version
          forge build --help >/dev/null
      - name: Compile public historical contract
        run: |
          mkdir -p /tmp/historical-replay/src
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/crytic/not-so-smart-contracts/master/reentrancy/Reentrancy.sol -o /tmp/historical-replay/src/Reentrancy.sol
          cd /tmp/historical-replay
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          out = "out"
          solc_version = "0.4.26"
          TOML
          forge build
      - name: Run isolated vulnerable and fixed EVM regression
        run: |
          set -euxo pipefail
          mkdir -p /tmp/historical-replay/test
          cp historical_replay/Reentrancy.t.sol /tmp/historical-replay/test/Reentrancy.t.sol
          cd /tmp/historical-replay
          forge test -vvv --match-contract HistoricalReentryTest 2>&1 | tee "$GITHUB_WORKSPACE/evm-replay.log"
      - name: Replay official Ethernaut challenge source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ethernaut-replay/{src,test,lib/openzeppelin-contracts-06/math}
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/OpenZeppelin/ethernaut/master/contracts/src/levels/Reentrance.sol -o /tmp/ethernaut-replay/src/Reentrance.sol
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/OpenZeppelin/openzeppelin-contracts/v3.4.2/contracts/math/SafeMath.sol -o /tmp/ethernaut-replay/lib/openzeppelin-contracts-06/math/SafeMath.sol
          cp historical_replay/EthernautReentrance.t.sol /tmp/ethernaut-replay/test/EthernautReentrance.t.sol
          cd /tmp/ethernaut-replay
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.6.12"
          remappings = ["openzeppelin-contracts-06/=lib/openzeppelin-contracts-06/"]
          TOML
          forge test -vvv --match-contract EthernautReentranceTest 2>&1 | tee "$GITHUB_WORKSPACE/ethernaut-replay.log"
      - name: Save environment versions
        run: |
          { forge --version; cast --version; anvil --version; } > evm-versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evm-versions
          path: |
            evm-versions.txt
            evm-replay.log
            ethernaut-replay.log
          if-no-files-found: warn
