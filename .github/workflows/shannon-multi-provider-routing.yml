name: Shannon multi-provider routing tests
on:
  workflow_dispatch:
  push:
    paths:
      - shannon_multi_provider_router.py
      - shannon_provider_preflight.py
      - test_shannon_multi_provider_router.py
      - test_shannon_provider_preflight.py
      - .github/workflows/shannon-multi-provider-routing.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v test_shannon_provider_preflight test_shannon_multi_provider_router
