name: Scrapling isolated smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Scrapling
        run: python -m pip install -r tools/scrapling/requirements.txt
      - name: Test local HTML parsing (no remote scraping)
        run: python tools/scrapling/smoke_test.py
