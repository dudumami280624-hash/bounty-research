name: AI child cloud-only free LLM acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - cloud_only_runtime.py
      - free_llm_router.py
      - test_cloud_only_runtime.py
      - test_free_llm_router.py
      - config/free-cloud-providers.json
      - .github/workflows/cloud-only-llm.yml
permissions:
  contents: read
jobs:
  validate-cloud-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify failover, token accounting and no local fallback
        run: python -m unittest -v test_free_llm_router test_cloud_only_runtime
      - name: Cloud-only readiness and live free-provider probe
        shell: bash
        env:
          GOOGLE_FREE_API_KEY: ${{ secrets.GOOGLE_FREE_API_KEY }}
          GROQ_FREE_API_KEY: ${{ secrets.GROQ_FREE_API_KEY }}
          OPENROUTER_FREE_API_KEY: ${{ secrets.OPENROUTER_FREE_API_KEY }}
        run: |
          set +e
          python cloud_only_runtime.py > cloud-readiness.json
          code=$?
          cat cloud-readiness.json
          if [ -z "$GOOGLE_FREE_API_KEY$GROQ_FREE_API_KEY$OPENROUTER_FREE_API_KEY" ]; then
            echo "BLOCKED: no provider secrets configured; no live call was attempted"
            [ "$code" -eq 3 ] && exit 0
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "Live cloud request completed"
            exit 0
          fi
          echo "FAILED: configured cloud providers did not pass live probe (exit $code)"
          exit 1
      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-only-readiness
          path: cloud-readiness.json
          if-no-files-found: warn
