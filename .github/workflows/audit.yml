name: Authorized public-source audit
# Verify conditional PoC evidence and status synchronization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit.yml'
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test candidate discovery logic
        run: python -m unittest -v test_discover.py

      - name: Test global bounty directory filtering
        run: python -m unittest -v test_global_bounties.py

      - name: Discover global cash bounty candidates
        continue-on-error: true
        run: python global_bounties.py

      - name: Test Bugcrowd public candidate selection
        run: python -m unittest -v test_bugcrowd_bounties.py

      - name: Extract Bugcrowd cash bounty candidates
        if: always()
        continue-on-error: true
        run: python bugcrowd_bounties.py

      - name: Discover publicly listed bounty candidates
        continue-on-error: true
        run: python discover.py

      - name: Install Foundry Solidity toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install free Solidity static analyzer
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.3

      - name: Run source review
        run: python audit.py

      - name: Run Slither source triage
        if: always()
        continue-on-error: true
        run: python slither_audit.py

      - name: Test evidence-gated report generation
        if: always()
        run: python -m unittest -v test_triage_reports.py

      - name: Generate deduplicated security review and report drafts
        if: always()
        run: |
          if [ -f slither_results.json ]; then
            python triage_reports.py
          else
            echo "No Slither findings available; drafts not generated"
          fi

      - name: Run isolated offline Foundry test baseline
        if: always()
        continue-on-error: true
        run: |
          if [ -f triage_results.json ]; then
            python validate_local.py
          fi

      - name: Execute paired local reward-accumulator reproduction
        if: always()
        continue-on-error: true
        run: |
          if [ -d _work/0 ]; then
            python run_specific_pocs.py
          fi

      - name: Verify scope and payout safety gates
        if: always()
        run: python -m unittest -v test_eligibility_gate.py

      - name: Generate bounty eligibility and payout status
        if: always()
        run: python eligibility_gate.py

      - name: Publish audit status to private repository
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_audit_status.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-results
          path: |
            audit.json
            candidates.json
            global_bounties.json
            bugcrowd_bounties.json
            slither_results.json
            triage_results.json
            report_drafts.md
            validation_results.json
            eligibility_status.json
            specific_poc_results.json
          if-no-files-found: warn

  hackerone_connection:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate HackerOne read-only API connection
        env:
          HACKERONE_API_TOKEN: ${{ secrets.HACKERONE_API_TOKEN }}
          HACKERONE_USERNAME: bountyhunterai26
        run: python hackerone_connection.py

      - name: Publish safe status to private repository
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_hackerone_status.py

      - name: Save connection status (no secrets or report content)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hackerone-connection-status
          path: hackerone_connection.json
          if-no-files-found: warn
