name: Authorized public-source audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run source review
        run: python audit.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-results
          path: audit.json
          if-no-files-found: warn
