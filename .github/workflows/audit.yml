name: Authorized public-source audit
# Validate and reconcile actual tZEN callback behavior; close synthetic reentrancy conditions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit.yml'
      - '*.py'
      - 'poc/**'
      - 'config.json'
      - 'official_scope_evidence.json'
      - 'scope_horizen.json'
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 23
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test candidate discovery logic
        run: python -m unittest -v test_discover.py

      - name: Test global bounty directory filtering
        run: python -m unittest -v test_global_bounties.py

      - name: Discover global cash bounty candidates
        continue-on-error: true
        run: python global_bounties.py

      - name: Test Bugcrowd public candidate selection
        run: python -m unittest -v test_bugcrowd_bounties.py

      - name: Extract Bugcrowd cash bounty candidates
        if: always()
        continue-on-error: true
        run: python bugcrowd_bounties.py

      - name: Discover publicly listed bounty candidates
        continue-on-error: true
        run: python discover.py

      - name: Test official bounty scope validation
        run: python -m unittest -v test_verify_official_scope.py

      - name: Verify official bounty opening, cash and exact assets
        run: python verify_official_scope.py

      - name: Restore pinned-source audit cache
        id: audit_cache
        uses: actions/cache@v4
        with:
          path: |
            audit.json
            slither_results.json
            triage_results.json
            report_drafts.md
            validation_results.json
            _work/0
          key: horizen-pinned-ab92502-audit-v3-${{ hashFiles('config.json', 'audit.py', 'slither_audit.py', 'triage_reports.py', 'validate_local.py', 'run_specific_pocs.py', 'poc/**') }}

      - name: Install Foundry Solidity toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install free Solidity static analyzer
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.3

      - name: Run source review
        if: steps.audit_cache.outputs.cache-hit != 'true'
        run: python audit.py

      - name: Run Slither source triage
        if: steps.audit_cache.outputs.cache-hit != 'true'
        run: python slither_audit.py

      - name: Test evidence-gated report generation
        if: always()
        run: python -m unittest -v test_triage_reports.py

      - name: Generate deduplicated security review and report drafts
        if: steps.audit_cache.outputs.cache-hit != 'true'
        run: |
          if [ -f slither_results.json ]; then
            python triage_reports.py
          else
            echo "No Slither findings available; drafts not generated"
          fi

      - name: Verify exact-file scope triage
        if: always()
        run: python -m unittest -v test_scope_review.py

      - name: Classify prioritized alerts by source and scope
        if: always()
        run: python scope_review.py

      - name: Run isolated offline Foundry test baseline
        if: steps.audit_cache.outputs.cache-hit != 'true'
        run: |
          if [ -f triage_results.json ]; then
            python validate_local.py
          fi

      - name: Execute paired local reward-accumulator reproduction
        if: always()
        run: python run_specific_pocs.py

      - name: Test local fork runner safeguards
        if: always()
        run: python -m unittest -v test_run_deployment_fork.py

      - name: Test RPC failover and strict chain verification
        if: always()
        run: python -m unittest -v test_rpc_failover.py

      - name: Verify actual deployed Horizen contracts on read-only local fork
        if: always()
        id: deployment_fork
        env:
          HORIZEN_TESTNET_RPC_URL: ${{ secrets.HORIZEN_TESTNET_RPC_URL }}
        continue-on-error: true
        run: python run_deployment_fork.py

      - name: Test independent explorer evidence fallback
        if: always()
        run: python -m unittest -v test_explorer_evidence.py

      - name: Collect official explorer REST contract evidence
        if: always()
        run: python explorer_evidence.py

      - name: Diagnose RPC failures for unattended maintenance
        if: always()
        run: python rpc_maintenance.py

      - name: Generate fail-closed repair proposal automatically
        if: always()
        run: python propose_repair.py

      - name: Classify RPC infrastructure failure separately from contract validation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("deployment_fork_results.json")
          if not p.exists():
              raise SystemExit("Missing deployment fork evidence")
          result=json.loads(p.read_text())
          stage=result.get("error_stage")
          if result.get("execution")=="passed":
              print("Deployed contract fork validation: passed")
          elif stage=="deployment_snapshot":
              print("Deployed contract fork validation: BLOCKED by RPC snapshot; not passed")
              print("Endpoint diagnostics:",result.get("error_detail","not available"))
          else:
              print("Deployed contract fork validation: FAILED at",stage)
              raise SystemExit(1)
          PY

      - name: Test per-lead evidence reconciliation
        if: always()
        run: python -m unittest -v test_reconcile_leads.py

      - name: Reconcile dynamically discovered security leads against actual proof
        if: always()
        run: python reconcile_leads.py

      - name: Test verified report generation and evidence safety
        if: always()
        run: python -m unittest -v test_build_verified_reports.py

      - name: Generate only evidence-backed reports, never submit
        if: always()
        run: python build_verified_reports.py

      - name: Verify scope and payout safety gates
        if: always()
        run: python -m unittest -v test_eligibility_gate.py

      - name: Generate bounty eligibility and payout status
        if: always()
        run: python eligibility_gate.py

      - name: Test secure submission gating
        if: always()
        run: python -m unittest -v test_submission_gate.py

      - name: Evaluate report readiness without submitting
        if: always()
        run: python submission_gate.py

      - name: Test complete six-stage isolated end-to-end integration
        if: always()
        run: python -m unittest -v test_business_pipeline.py

      - name: Test six-stage acceptance against real and fixture evidence
        if: always()
        run: python -m unittest -v test_acceptance.py

      - name: Generate today's fail-closed six-stage acceptance
        if: always()
        run: python acceptance.py

      - name: Install exact upstream Node 24.16.0 for official in-scope dApp
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Review exact pinned Horizen staking frontend with native tools
        if: always()
        run: python run_frontend_scope.py

      - name: Test independent research acceptance scoreboard
        if: always()
        run: python -m unittest -v test_research_scoreboard.py

      - name: Build evidence-separated research scoreboard
        if: always()
        run: python research_scoreboard.py

      - name: Publish audit status to private repository
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_audit_status.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-results
          path: |
            audit.json
            candidates.json
            global_bounties.json
            bugcrowd_bounties.json
            slither_results.json
            triage_results.json
            report_drafts.md
            validation_results.json
            eligibility_status.json
            specific_poc_results.json
            submission_status.json
            lead_verification.json
            scope_review.json
            acceptance_status.json
            deployment_fork_results.json
            rpc_maintenance_diagnosis.json
            repair_proposal.json
            research_scoreboard.json
            explorer_evidence.json
            frontend_scope_results.json
            official_scope_status.json
            ACCEPTANCE.md
            report_build_status.json
            reports/verified_*.md
          if-no-files-found: warn

  hackerone_connection:
    concurrency:
      group: hackerone-status-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate HackerOne read-only API connection
        env:
          HACKERONE_API_TOKEN: ${{ secrets.HACKERONE_API_TOKEN }}
          HACKERONE_USERNAME: bountyhunterai26
        run: python hackerone_connection.py

      - name: Test read-only HackerOne report tracker
        run: python -m unittest -v test_hackerone_report_tracking.py

      - name: Sync actual HackerOne report states (read-only)
        env:
          HACKERONE_API_TOKEN: ${{ secrets.HACKERONE_API_TOKEN }}
          HACKERONE_USERNAME: bountyhunterai26
        run: python hackerone_report_tracking.py

      - name: Publish safe status to private repository
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_hackerone_status.py

      - name: Save connection status (no secrets or report content)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hackerone-connection-status
          path: |
            hackerone_connection.json
            hackerone_reports.json
          if-no-files-found: warn
