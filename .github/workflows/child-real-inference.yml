name: AI child real model inference
on:
  workflow_dispatch:
  push:
    paths:
      - student_reasoner.py
      - student_revision_loop.py
      - .github/workflows/child-real-inference.yml
permissions:
  contents: read
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build llama.cpp CPU binary from source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama-src
          cmake -S /tmp/llama-src -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-build --config Release --target llama-cli -j 2
          test -x /tmp/llama-build/bin/llama-cli
          echo "LLAMA_CLI=/tmp/llama-build/bin/llama-cli" >> "$GITHUB_ENV"
      - name: Download free open GGUF model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 300 "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -o /tmp/child-model.gguf
          test "$(stat -c%s /tmp/child-model.gguf)" -gt 100000000
      - name: Run real local inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p child-evidence
          python student_reasoner.py --lesson reentrancy-01 --model /tmp/child-model.gguf --output child-evidence/model-reasoning.json
          python - <<'PY'
          import json
          x=json.load(open("child-evidence/model-reasoning.json"))
          assert x["agent"]["model_inference_executed"] is True
          assert x["agent"]["independent_completion_verified"] is False
          print("Real model inference executed; independent solving still unverified")
          PY
      - name: Real-model feedback and revision loop
        shell: bash
        run: |
          set -euo pipefail
          python student_revision_loop.py --lesson access-control-01 --model /tmp/child-model.gguf --output child-evidence/revision-loop.json
      - name: Upload model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-real-inference-evidence
          path: child-evidence/
          if-no-files-found: warn
