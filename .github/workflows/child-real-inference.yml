name: AI child real model inference
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    paths:
      - student_reasoner.py
      - student_curriculum.py
      - student_course_gate.py
      - student_course_runner.py
      - student_independent_patch.py
      - student_skill_registry.py
      - test_student_skill_registry.py
      - test_student_course_gate.py
      - student_session.py
      - knowledge_sources/seed.json
      - student_revision_loop.py
      - student_learning_acceptance.py
      - student_authorization.py
      - test_student_authorization.py
      - student_learning_pipeline.py
      - test_student_learning_pipeline.py
      - test_student_two_session_memory.py
      - test_student_learning_acceptance.py
      - test_student_strict_acceptance.py
      - student_learning_memory.py
      - student_real_memory_check.py
      - test_student_revision_loop.py
      - .github/workflows/child-real-inference.yml
permissions:
  contents: read
concurrency:
  group: child-real-inference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified CPU runner cache
        id: runner-cache
        uses: actions/cache@v4
        with:
          path: /tmp/llama-build
          key: child-llama-cpu-v1-${{ runner.os }}
      - name: Build llama.cpp CPU binary if absent
        if: steps.runner-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama-src
          cmake -S /tmp/llama-src -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-build --config Release --target llama-cli -j 2
      - name: Validate cached CPU runner
        shell: bash
        run: |
          set -euo pipefail
          test -x /tmp/llama-build/bin/llama-cli
          echo "LLAMA_CLI=/tmp/llama-build/bin/llama-cli" >> "$GITHUB_ENV"
      - name: Restore free GGUF model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: /tmp/child-model.gguf
          key: child-qwen2.5-0.5b-instruct-q4km-v1
      - name: Download free model only when missing
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 300 "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -o /tmp/child-model.gguf
      - name: Verify model file
        run: |
          test "$(stat -c%s /tmp/child-model.gguf)" -gt 100000000
          sha256sum /tmp/child-model.gguf
      - name: Build curated offline lesson index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          seeds=json.loads(Path('knowledge_sources/seed.json').read_text())
          index={'curated:'+str(i):{'source':'curated-case',**v} for i,v in enumerate(seeds)}
          Path('/tmp/child-knowledge-index.json').write_text(json.dumps(index,ensure_ascii=False))
          print('Curated knowledge entries:',len(index))
          PY
      - name: Run real local inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p child-evidence
          python student_reasoner.py --lesson reentrancy-01 --model /tmp/child-model.gguf --output child-evidence/model-reasoning.json --knowledge-index /tmp/child-knowledge-index.json
          python - <<'PY'
          import json
          x=json.load(open("child-evidence/model-reasoning.json"))
          assert x["agent"]["model_inference_executed"] is True
          assert x["knowledge_retrieval"]["entries_used"] > 0
          assert x["agent"]["independent_completion_verified"] is False
          print("Real model inference executed; independent solving still unverified")
          PY
      - name: Verify two-session learning memory and retrieval regression
        run: python -m unittest -v test_student_two_session_memory
      - name: Verify strict held-out acceptance rules
        run: python -m unittest -v test_student_strict_acceptance
      - name: Verify offline learning pipeline unit tests
        run: python -m unittest -v test_student_learning_pipeline
      - name: Verify authorization boundary regression tests
        run: python -m unittest -v test_student_authorization
      - name: Verify local Skill registry and static preflight
        run: python -m unittest -v test_student_skill_registry
      - name: Verify feedback-loop regression tests
        run: python -m unittest -v test_student_revision_loop
      - name: Verify curriculum progression tests
        run: python -m unittest -v test_student_course_gate
      - name: Real-model feedback and revision loop
        shell: bash
        run: |
          set -euo pipefail
          python student_revision_loop.py --lesson access-control-01 --model /tmp/child-model.gguf --output child-evidence/revision-loop.json
      - name: Install Foundry for real curriculum lab
        uses: foundry-rs/foundry-toolchain@v1
      - name: Execute integrated learning course with real model and Forge
        shell: bash
        run: |
          set -euo pipefail
          python student_course_runner.py --lesson reentrancy-01 --model /tmp/child-model.gguf --output child-evidence/course-session.json
          python - <<'PY'
          import json
          x=json.load(open('child-evidence/course-session.json'))
          lab=x['evidence']['reentrancy-01']['lab']
          assert lab['executed'] and lab['passed'], f'Foundry lab not passed: {lab}'
          assert x['course_gate']['reentrancy-01']['passed'] is False
          print('Real Foundry lab passed; independent course completion not verified')
          PY
      - name: Verify two genuine model learning sessions and persistent memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p child-evidence/knowledge
          echo '提款合约应先更新状态，再进行外部调用。检查重入和余额不变量。' > child-evidence/knowledge/reentrancy.md
          python student_real_memory_check.py --model /tmp/child-model.gguf --knowledge child-evidence/knowledge --out child-evidence/real-memory
      - name: Attempt independent model-generated Solidity repair
        shell: bash
        run: |
          set -euo pipefail
          python student_skill_registry.py --skill solidity-repair --lesson reentrancy-01 --model /tmp/child-model.gguf --output child-evidence/independent-patch.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('child-evidence/independent-patch.json').read_text())
          print('Model patch attempts:',len(x['attempts']))
          print('Independent teaching fixture passed:',x['independent_patch_test_passed'])
          assert x['real_model_invoked'], 'No real model invocation'
          assert all('raw_model_output' in a for a in x['attempts'])
          assert x['independent_patch_test_passed'], 'Model-generated repair failed the isolated Foundry test; see uploaded evidence'
          PY
      - name: Evaluate autonomous learning evidence (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_student_strict_acceptance
          python student_learning_acceptance.py --revision child-evidence/revision-loop.json --patch child-evidence/independent-patch.json --output child-evidence/learning-acceptance.json
          python - <<'PY'
          import json
          x=json.load(open('child-evidence/learning-acceptance.json'))
          assert x['assisted_foundry_passed'], 'Assisted repair regression'
          print('Autonomous learning accepted:', x['autonomous_learning_accepted'])
          print('Model-only repair:', x['model_only_foundry_passed'])
          PY
      - name: Upload model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-real-inference-evidence
          path: child-evidence/
          if-no-files-found: error
