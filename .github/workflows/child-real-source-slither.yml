name: Upstream Slither real bounty source triage
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/child-real-source-slither.yml
      - horizen_candidate_triage.py
      - horizen_p0_source_evidence.py
permissions:
  contents: read
jobs:
  pinned-source-slither:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve configured pinned public source
        run: python audit.py
      - name: Install official Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
      - name: Restore pinned upstream submodules and compiler
        run: |
          set -euo pipefail
          git -C _work/0 submodule update --init --recursive --depth 1
          forge --version
          (cd _work/0 && forge build)
      - name: Install official free Slither
        run: |
          python -m pip install 'slither-analyzer==0.11.3' solc-select
          slither --version
      - name: Execute real source static analysis
        run: python slither_audit.py
      - name: Classify candidates by authorized source scope
        run: python horizen_candidate_triage.py
      - name: Extract exact source-line evidence for P0 candidates
        run: python horizen_p0_source_evidence.py
      - name: Preserve evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-source-slither
          path: |
            audit.json
            slither_results.json
            horizen_candidate_triage.json
            horizen_p0_queue.json
            horizen_public_crosscheck.json
            horizen_p0_source_evidence.json
          if-no-files-found: warn
          retention-days: 30
