name: AI child Shannon blind diagnosis
on:
  workflow_dispatch:
  push:
    paths:
      - student_shannon_diagnostic.py
      - training_cases/shannon_variant_v2.txt
      - test_student_shannon_diagnostic.py
      - .github/workflows/child-shannon-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: |
          python -m py_compile student_shannon_diagnostic.py test_student_shannon_diagnostic.py
          python -m unittest -v test_student_shannon_diagnostic
      - name: Build free local inference engine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama-src
          cmake -S /tmp/llama-src -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-build --target llama-cli -j 2
          echo "LLAMA_CLI=/tmp/llama-build/bin/llama-cli" >> "$GITHUB_ENV"
      - name: Download free GGUF model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 300 "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf" -o /tmp/child-model.gguf
          test "$(stat -c%s /tmp/child-model.gguf)" -gt 1000000000
      - name: Run original and unseen transfer diagnosis
        shell: bash
        run: |
          set +e
          python student_shannon_diagnostic.py --model /tmp/child-model.gguf --output child-evidence/shannon-diagnosis.json
          original_status=$?
          python student_shannon_diagnostic.py --model /tmp/child-model.gguf --case-file training_cases/shannon_variant_v2.txt --output child-evidence/shannon-variant-v2.json
          variant_status=$?
          echo "Original case exit: $original_status; unseen variant exit: $variant_status"
          if [ "$original_status" -ne 0 ] || [ "$variant_status" -ne 0 ]; then exit 1; fi
      - name: Preserve evidence on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shannon-blind-diagnosis-evidence
          path: child-evidence/
          if-no-files-found: warn
