name: AI child 7B comparative acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/child-qwen7b-comparison.yml
      - training_cases/shannon_variant_v3.txt
      - student_shannon_diagnostic.py
permissions:
  contents: read
jobs:
  qwen7b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests before inference
        run: |
          python -m py_compile student_shannon_diagnostic.py
          python -m unittest -v test_student_shannon_diagnostic
      - name: Build llama.cpp CPU inference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama-src
          cmake -S /tmp/llama-src -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-build --target llama-cli -j 2
          echo "LLAMA_CLI=/tmp/llama-build/bin/llama-cli" >> "$GITHUB_ENV"
      - name: Download free Qwen2.5 7B Q4 GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 600 "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf" -o /tmp/child-7b.gguf
          test "$(stat -c%s /tmp/child-7b.gguf)" -gt 3000000000
      - name: Run 7B original and held-out case
        shell: bash
        run: |
          set +e
          python student_shannon_diagnostic.py --model /tmp/child-7b.gguf --output child-evidence/qwen7b-original.json
          original=$?
          python student_shannon_diagnostic.py --model /tmp/child-7b.gguf --case-file training_cases/shannon_variant_v2.txt --output child-evidence/qwen7b-variant.json
          variant=$?
          python student_shannon_diagnostic.py --model /tmp/child-7b.gguf --case-file training_cases/shannon_variant_v3.txt --output child-evidence/qwen7b-variant-v3.json
          variant3=$?
          echo "Qwen7B original=$original variant=$variant variant3=$variant3"
          test "$original" -eq 0 && test "$variant" -eq 0 && test "$variant3" -eq 0
      - name: Preserve answers and rubric even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen7b-acceptance-evidence
          path: child-evidence/
          if-no-files-found: warn
          retention-days: 30
