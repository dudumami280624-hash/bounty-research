name: Install self-improving agent skill
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/install-self-improving-agent.yml
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install upstream self-improving-agent skill for Codex
        run: |
          set -euo pipefail
          npx -y skills add zhaono1/agent-playbook --skill self-improving-agent --agent codex --copy -y
          test -f .agents/skills/self-improving-agent/SKILL.md
          grep -qi 'self-improving' .agents/skills/self-improving-agent/SKILL.md
          npx -y skills list
      - name: Save installed skill for child agent integration
        uses: actions/upload-artifact@v4
        with:
          name: self-improving-agent-skill
          path: .agents/skills/self-improving-agent/
          if-no-files-found: error
          retention-days: 30
