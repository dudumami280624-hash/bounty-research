name: Scrapling bounty intake (offline fixture)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/scrapling/requirements.txt
      - name: Test fail-closed bounty intake
        run: PYTHONPATH=tools/scrapling python -m unittest -v tools/scrapling/test_bounty_intake.py
      - name: Run Scrapling offline parser smoke test
        run: python tools/scrapling/smoke_test.py
