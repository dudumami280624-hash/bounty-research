name: Install Smart Charts for AI child
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/install-smart-charts.yml
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install upstream Smart Charts skill
        run: |
          set -euo pipefail
          npx -y skills add hherosoul/dsh-smart-charts --skill smart-charts --agent codex --copy -y
          test -f .agents/skills/smart-charts/SKILL.md
          npx -y skills list
      - name: Preserve installed skill
        uses: actions/upload-artifact@v4
        with:
          name: smart-charts-skill
          path: .agents/skills/smart-charts/
          if-no-files-found: error
          retention-days: 30
