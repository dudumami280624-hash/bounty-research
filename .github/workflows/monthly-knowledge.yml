name: Twice-daily public vulnerability knowledge intake
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/monthly-knowledge.yml
      - collect_public_advisories.py
      - build_knowledge_index.py
      - knowledge_ingest.py
      - knowledge_sources/**
  schedule:
    - cron: '20 3,15 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public advisories and aggregate sample counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python collect_public_advisories.py --pages 5 --output advisory-knowledge.json --summary advisory-summary.json 2>&1 | tee advisory-collection.log
          python - <<'PY'
          import json
          records=json.load(open("advisory-knowledge.json"))
          assert records, "No public advisories collected"
          assert all(k==v["id"] and v["source_url"] for k,v in records.items())
          summary=json.load(open("advisory-summary.json"))
          assert summary["sample_size"] == len(records)
          print("Verified unique records:",len(records))
          PY
      - name: Connect public knowledge to indexed research cases
        run: |
          set -euo pipefail
          python knowledge_ingest.py knowledge_sources/seed.json vulnerability-knowledge.json
          python build_knowledge_index.py advisory-knowledge.json vulnerability-knowledge.json knowledge-index.json
          python - <<'PY'
          import json
          a=json.load(open("advisory-knowledge.json"))
          k=json.load(open("knowledge-index.json"))
          assert len(k)==len(a)+2, (len(k),len(a))
          assert all(not v["detector_ready"] for v in k.values())
          print("Knowledge bridge validated:",len(k),"records")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-advisory-knowledge
          path: |
            advisory-knowledge.json
            advisory-summary.json
            vulnerability-knowledge.json
            knowledge-index.json
            advisory-collection.log
          retention-days: 90
          if-no-files-found: warn
