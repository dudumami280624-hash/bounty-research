name: Authorized public-source audit
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local source review
        run: python audit.py
      - name: Preserve review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
