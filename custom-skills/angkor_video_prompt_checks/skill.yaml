  needs_review: false
  rationale: 'EP14 and EP22 share one root cause that the current angkor skill does not name: a partial check treated as complete. EP14 drew a hook-won verdict from a partial like rate and retracted it when the full backend showed low average watch time, low completion and most viewers stopping in 0 to 2 seconds. EP22 claimed a full check from only 7 frames, dismissed inscription pseudo-text as minor, and only passed after all 13 frames were checked in one pass in v6. The existing skill covers start, middle and final frame checks, but it has no gate against a partial-metric verdict, a split frame check, or dismissing a found defect, so adding that complete-check gate addresses both failures without a duplicate skill.'
