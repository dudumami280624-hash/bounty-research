# Cobalt standalone media retrieval service; not part of textbook/OCR CI.
# Bind to loopback only. Do not publish port 9000 without authentication and TLS.
services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: market-mind-cobalt
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000/tcp"
    environment:
      API_URL: "http://localhost:9000/"
